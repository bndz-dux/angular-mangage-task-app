<nav class="breadcrumb" aria-label="Breadcrumb">
  @for (item of navigationService.breadcrumbs(); track item.label; let last = $last) {
    @if (!last && item.url) {
      <a [routerLink]="item.url" class="crumb-link">{{ item.label }}</a>
      <span class="crumb-sep" aria-hidden="true">/</span>
    } @else {
      <span class="crumb-leaf" [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span>
    }
  }
</nav>
