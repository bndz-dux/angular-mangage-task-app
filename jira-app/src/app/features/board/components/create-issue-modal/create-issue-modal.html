@if (projectStore.isCreateModalOpen()) {
  <div
    class="modal"
    (click)="onBackdropClick($event)"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="create-modal-title"
  >
    <div class="modal-card" (click)="$event.stopPropagation()">
      <!-- Modal Header -->
      <div class="modal-head">
        <h2 id="create-modal-title">Create Issue</h2>
        <button
          class="icon-btn"
          (click)="projectStore.closeCreateModal()"
          aria-label="Close create issue modal"
        >
          <app-svg-icon name="x" [size]="16" />
        </button>
      </div>

      <!-- Modal Form Body -->
      <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="modal-body">
        <!-- Issue Type Row -->
        <div class="form-row">
          <label class="field-label" for="create-issue-type">Issue Type</label>
          <select id="create-issue-type" formControlName="type">
            <option value="story">🟢 Story</option>
            <option value="task">🔵 Task</option>
            <option value="bug">🔴 Bug</option>
            <option value="epic">🟣 Epic</option>
          </select>
        </div>

        <!-- Title / Short Summary Row (Auto Focused) -->
        <div class="form-row">
          <label class="field-label" for="create-issue-title">
            Short Summary <span class="required">*</span>
          </label>
          <input
            #titleInput
            type="text"
            id="create-issue-title"
            formControlName="title"
            placeholder="e.g. Fix auth redirect loop on session timeout"
            [class.invalid]="isTitleInvalid()"
          />
          @if (isTitleInvalid()) {
            <span class="err" role="alert">Title is required (minimum 3 characters).</span>
          }
        </div>

        <!-- Description Row -->
        <div class="form-row">
          <label class="field-label" for="create-issue-desc">Description</label>
          <textarea
            id="create-issue-desc"
            formControlName="description"
            placeholder="Add detailed description of the task or issue..."
          ></textarea>
        </div>

        <!-- Grid Row: Status & Priority -->
        <div class="form-grid-2">
          <div class="form-row">
            <label class="field-label" for="create-issue-status">Status</label>
            <select id="create-issue-status" formControlName="status">
              @for (col of columns; track col.id) {
                <option [value]="col.id">{{ col.title }}</option>
              }
            </select>
          </div>

          <div class="form-row">
            <label class="field-label" for="create-issue-priority">Priority</label>
            <select id="create-issue-priority" formControlName="priority">
              <option value="highest">Highest ⏫</option>
              <option value="high">High 🔼</option>
              <option value="medium">Medium 🟰</option>
              <option value="low">Low 🔽</option>
              <option value="lowest">Lowest ⏬</option>
            </select>
          </div>
        </div>

        <!-- Grid Row: Assignee & Story Points -->
        <div class="form-grid-2">
          <div class="form-row">
            <label class="field-label" for="create-issue-assignee">Assignee</label>
            <select id="create-issue-assignee" formControlName="assigneeId">
              <option value="">Unassigned</option>
              @for (user of userService.users(); track user.id) {
                <option [value]="user.id">{{ user.name }} ({{ user.role }})</option>
              }
            </select>
          </div>

          <div class="form-row">
            <label class="field-label" for="create-issue-estimate">Story Points</label>
            <input
              type="number"
              id="create-issue-estimate"
              formControlName="estimate"
              min="0"
              max="100"
              placeholder="e.g. 3"
            />
          </div>
        </div>

        <!-- Modal Footer Actions -->
        <div class="modal-foot">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="projectStore.closeCreateModal()"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="createForm.invalid"
          >
            Create Issue
          </button>
        </div>
      </form>
    </div>
  </div>
}
